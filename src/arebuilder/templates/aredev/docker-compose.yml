services:
  db:
    # MariaDB stores local test-server state in named volumes so restarts are
    # fast, while the schema/time seed files remain bind-mounted from the project.
    container_name: aredevdbserver
    hostname: db
    image: docker.io/library/mariadb:10
    # Host development data must retain labels used by native tools and NWN.
    security_opt:
      - label=disable
    env_file: ${AREDEV_CONFIG_ROOT:-.}/config/db.env
    volumes:
      - database:/var/lib/mysql
      - ${AREDEV_HOST_ROOT:-.}/are-resources/db_schema/schema_mysql.sql:/docker-entrypoint-initdb.d/schema_mysql.sql:ro
      - ${AREDEV_HOST_ROOT:-.}/data/timeinit.sql:/docker-entrypoint-initdb.d/timeinit.sql:ro
    restart: unless-stopped

  influxdb:
    # NWNX emits profiler samples through InfluxDB's native UDP listener. The
    # service stays internal to the Compose network; Grafana is its only reader.
    container_name: aredevinfluxdb
    hostname: influxdb
    image: docker.io/library/influxdb:1.12.4
    environment:
      INFLUXDB_DB: nwn
      INFLUXDB_UDP_ENABLED: "true"
      INFLUXDB_UDP_BIND_ADDRESS: ":8089"
      INFLUXDB_UDP_DATABASE: nwn
      INFLUXDB_REPORTING_DISABLED: "true"
    volumes:
      - profiler_influxdb:/var/lib/influxdb
    restart: unless-stopped

  grafana:
    # Grafana is local-only. Its datasource and dashboard are provisioned from
    # generated config so a normal AREDev start is immediately usable.
    container_name: aredevgrafana
    hostname: grafana
    image: docker.io/grafana/grafana:13.1.1
    security_opt:
      - label=disable
    depends_on:
      - influxdb
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: aredev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - profiler_grafana:/var/lib/grafana
      - type: bind
        source: ${AREDEV_CONFIG_ROOT:-.}/config/grafana/provisioning/datasources
        target: /etc/grafana/provisioning/datasources
        read_only: true
      - type: bind
        source: ${AREDEV_CONFIG_ROOT:-.}/config/grafana/provisioning/dashboards
        target: /etc/grafana/provisioning/dashboards
        read_only: true
      - type: bind
        source: ${AREDEV_CONFIG_ROOT:-.}/config/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  nwserver:
    # The NWN server consumes project/server runtime content plus HAK/TLK files
    # mounted directly from the configured NWN home.
    container_name: aredevnwserver
    hostname: nwserver
    image: ${NWSERVER_IMAGE:-docker.io/dmhoodoo/aredevnwnxserver:latest}
    security_opt:
      - label=disable
    env_file: ${AREDEV_CONFIG_ROOT:-.}/config/nwserver.env
    depends_on:
      - db
      # AREDev starts only the nwserver target. Keeping Grafana in this
      # dependency graph ensures the provisioned dashboard starts with it.
      - grafana
      - influxdb
    environment:
      - NWN_MODULE
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${AREDEV_HOST_ROOT:-.}/logs
        target: /nwn/run/logs.0
      - type: bind
        source: ${AREDEV_HOST_ROOT:-.}/server
        target: /nwn/home
      - type: bind
        source: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}
        target: ${AREDEV_NWN_HOME_MOUNT_TARGET:-/nwn/aredev-host-home}
        read_only: true
      - type: bind
        source: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}/hak
        target: ${AREDEV_NWN_CONTENT_MOUNT_ROOT:-/nwn/home}/hak
        read_only: true
      - type: bind
        source: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}/tlk
        target: ${AREDEV_NWN_CONTENT_MOUNT_ROOT:-/nwn/home}/tlk
        read_only: true
      - type: bind
        source: ${AREDEV_HOST_ROOT:-.}/are-resources/ruby
        target: /nwn/ruby
        read_only: true
      - type: bind
        source: ${AREDEV_HOST_ROOT:-.}
        target: /var/builder
        read_only: true
    restart: unless-stopped
    ports:
      - "5121:5121/udp"

  builder:
    # The builder is isolated from the server network and works only through
    # bind-mounted project and NWN install directories.
    container_name: aredevbuilder
    hostname: builder
    image: ${BUILDER_IMAGE:-docker.io/kalopsiadev/arebuilder:latest}
    security_opt:
      - label=disable
    user: "1000:1000"
    working_dir: /var/builder
    env_file: ${AREDEV_CONFIG_ROOT:-.}/config/arebuilder.env
    environment:
      AREDEV_IN_CONTAINER: "1"
      AREDEV_HOST_ROOT: ${AREDEV_HOST_ROOT:-.}
      AREDEV_CONFIG_ROOT: /var/builder
      AREDEV_NWN_INSTALL_ROOT: ${AREDEV_NWN_INSTALL_ROOT:-${NWN_INSTALL_PATH}}
      AREDEV_NWN_HOME_ROOT: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}
      AREDEV_NWN_HOME_MODULES_ROOT: /nwn/home/modules
      AREDEV_HOST_LAUNCHER: ${AREDEV_HOST_LAUNCHER:-}
      NWN_ROOT: /nwn/install
      HAK_DIR: /nwn/home/hak
      TLK_DIR: /nwn/home/tlk
    volumes:
      - type: bind
        source: ${AREDEV_HOST_ROOT:-.}
        target: /var/builder
      - type: bind
        source: ${AREDEV_NWN_INSTALL_ROOT:-${NWN_INSTALL_PATH}}
        target: /nwn/install
        read_only: true
      - type: bind
        source: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}/hak
        target: /nwn/home/hak
      - type: bind
        source: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}/tlk
        target: /nwn/home/tlk
      - type: bind
        source: ${AREDEV_NWN_HOME_ROOT:-${NWN_HOME_PATH:-./server}}/modules
        target: /nwn/home/modules
    restart: "no"
    network_mode: "none"

volumes:
  # database is the active MariaDB data volume; data is retained for backward
  # compatibility with older scaffolds that referenced it.
  database:
    driver: local
  data:
    driver: local
  # Profiler telemetry is intentionally isolated from the server database and
  # may be removed independently while NWServer and InfluxDB are stopped.
  profiler_influxdb:
    name: aredev_profiler_influxdb
    driver: local
  profiler_grafana:
    name: aredev_profiler_grafana
    driver: local
